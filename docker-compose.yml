services:
  smarthouse:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: smarthouse:latest
    container_name: smarthouse

    # OBLIGATORIO: el servidor aprende la IP de cada ESP con request.remote_addr.
    # En modo bridge todos verían la gateway de Docker (172.17.0.1). Host
    # networking también habilita mDNS y los broadcast de la LAN.
    network_mode: host

    restart: unless-stopped

    # SMARTHOUSE_VERSION la exporta deploy.sh con el tag desplegado; /health la
    # reporta. app.env (config de la app) vive solo en la Pi, nunca en el repo.
    environment:
      - SMARTHOUSE_VERSION=${SMARTHOUSE_VERSION:-unknown}
    env_file:
      - /etc/smarthouse/app.env

    volumes:
      - smarthouse-data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  smarthouse-data:
